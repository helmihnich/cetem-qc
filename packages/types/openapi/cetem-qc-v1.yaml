        '409': { description: Summary already confirmed for this audit (SUMMARY_CONFIRMED), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '422': { description: Invalid body (VALIDATION_FAILED), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '500': { description: Evidence inconsistent or insight not recorded (INTERNAL_ERROR), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /tasks/{taskId}/summary-drafts:
