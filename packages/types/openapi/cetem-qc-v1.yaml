        '201':
          description: Recorded draft (Cache-Control no-store)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SummaryDraftResponse'
        '401': { description: Session rejected, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '403': { description: Responsable role required (FORBIDDEN), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '404': { description: Malformed, unknown or another team's task, or no accepted submission (TASK_NOT_FOUND), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '409': { description: Summary already confirmed for this audit (SUMMARY_CONFIRMED), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '422': { description: Non-empty body (VALIDATION_FAILED), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '500': { description: Evidence inconsistent or request not recorded (INTERNAL_ERROR), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '502': { description: Provider failed; a failed row is recorded and the request can be sent again (AI_UNAVAILABLE), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /tasks/{taskId}/summary-confirmation:
