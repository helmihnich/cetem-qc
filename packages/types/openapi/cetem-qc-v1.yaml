                text: { type: string, minLength: 1 }
                provider: { type: string, minLength: 1 }
                model: { type: string, minLength: 1 }
                requestedAt: { type: string, format: date-time }
                summaryInputSetId: { type: string, pattern: '^[0-9a-f]{64}$' }
    InsightDecisionRequest:
