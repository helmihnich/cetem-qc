        tasks:
          type: array
          items:
            $ref: '#/components/schemas/EmployeeTaskListItem'
    EmployeeTaskListItem:
      type: object
      additionalProperties: false
      required: [id, type, establishment, service, state, createdAt]
      properties:
        id: { type: string, format: uuid }
        type:
          type: string
          enum: [graphie_mobile]
        establishment: { type: string }
        service: { type: string }
        state:
          type: string
          const: draft
        createdAt: { type: string, format: date-time }
    EmployeeTaskResponse:
      type: object
      additionalProperties: false
      required: [task]
      properties:
        task:
          $ref: '#/components/schemas/EmployeeTaskListItem'
    GraphieDraftPayload:
      type: object
      description: >-
        Graphie Mobile form payload, catalogue graphie-mobile-pov 2.0.0, schema 3, rule cetem-paper-form 2.0.0.
        Values are raw strings, kept unchanged; blank and unparseable readings are valid. legacyContent is refused
        on a submission.
      additionalProperties: false
      required: [catalogueId, catalogueVersion, schemaVersion, ruleId, ruleVersion, values]
      properties:
        catalogueId: { type: string, const: graphie-mobile-pov }
        catalogueVersion: { type: string, const: 2.0.0 }
        schemaVersion: { type: integer, const: 3 }
        ruleId: { type: string, const: cetem-paper-form }
        ruleVersion: { type: string, const: 2.0.0 }
        values:
          type: object
          additionalProperties: { type: string }
        legacyContent: { type: string }
    SyncOperationRequest:
      type: object
      additionalProperties: false
      required: [operationId, idempotencyKey, baseRevision, localDraftRevision, clientSavedAt, payload]
      properties:
        operationId: { type: string, format: uuid }
        idempotencyKey: { type: string, format: uuid }
        baseRevision: { type: integer, minimum: 0 }
        localDraftRevision: { type: integer, minimum: 1 }
        clientSavedAt: { type: string, format: date-time }
        payload:
          type: object
          description: >-
            A GraphieDraftPayload. Its content is validated by the server and refused with a stored 422
            SyncOperationRejected (UNSUPPORTED_PAYLOAD, UNSUPPORTED_PAYLOAD_VERSION, INVALID_PAYLOAD), not by the envelope.
          additionalProperties: true
        conflictOperationId:
          type: string
          format: uuid
          description: >-
            Optional. The operation ID of the stored conflict outcome this operation resolves (keep-local).
            It must be a conflict of the same actor and task, not yet linked; otherwise the operation is
            refused with a stored 422 INVALID_CONFLICT_REFERENCE. On acceptance one sync-conflict-revision
            lineage link is recorded.
        correctionOfOperationId:
          type: string
          format: uuid
          description: >-
            Optional. The operation ID of the stored rejected submission this operation corrects. It must be
            a rejected submit of the same actor and task, with a code other than AUDIT_ALREADY_SUBMITTED, not
            yet linked or already linked as a correction to this task's audit; otherwise the operation is
            refused with a stored 422 INVALID_CORRECTION_REFERENCE. The first accepted operation carrying an
            unlinked reference records one rejected-submission-correction lineage link.
    SyncOperationKind:
      type: string
      enum: [sync-draft, submit]
    SyncActor:
      type: object
      additionalProperties: false
      required: [id, displayName]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
    SyncOperationAccepted:
      type: object
      additionalProperties: false
      required: [outcome, operationId, kind, serverRevision, acceptedAt, acceptedBy]
      properties:
        outcome: { type: string, const: accepted }
        operationId: { type: string, format: uuid }
        kind:
          $ref: '#/components/schemas/SyncOperationKind'
        serverRevision: { type: integer, minimum: 1 }
        acceptedAt: { type: string, format: date-time }
        acceptedBy:
          $ref: '#/components/schemas/SyncActor'
        submissionId:
          type: string
          format: uuid
          description: Present only for a submission.
    SyncOperationConflict:
      type: object
      additionalProperties: false
      required: [outcome, operationId, kind, serverRevision, current]
      properties:
        outcome: { type: string, const: conflict }
        operationId: { type: string, format: uuid }
        kind:
          $ref: '#/components/schemas/SyncOperationKind'
        serverRevision: { type: integer, minimum: 0 }
        current:
          type: object
          additionalProperties: false
          required: [revision, state, lastChangedAt, lastChangedBy]
          properties:
            revision: { type: integer, minimum: 0 }
            state:
              type: string
              enum: [draft, submitted]
            lastChangedAt:
              type: [string, 'null']
              format: date-time
            lastChangedBy:
              oneOf:
                - $ref: '#/components/schemas/SyncActor'
                - type: 'null'
    SyncOperationRejected:
      type: object
      additionalProperties: false
      required: [outcome, operationId, kind, code, message, issues]
      properties:
        outcome: { type: string, const: rejected }
        operationId: { type: string, format: uuid }
        kind:
          $ref: '#/components/schemas/SyncOperationKind'
        code:
          type: string
          enum: [UNSUPPORTED_PAYLOAD, UNSUPPORTED_PAYLOAD_VERSION, INVALID_PAYLOAD, AUDIT_ALREADY_SUBMITTED, INVALID_CONFLICT_REFERENCE, INVALID_CORRECTION_REFERENCE]
        message: { type: string }
        issues:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [path, code]
            properties:
              path: { type: string }
              code: { type: string }
    EmployeeTaskAuditVersion:
      type: object
      additionalProperties: false
      required: [revision, state, lastChangedAt, lastChangedBy, payload]
      properties:
        revision: { type: integer, minimum: 0 }
        state:
          type: string
          enum: [draft, submitted]
        lastChangedAt:
          type: [string, 'null']
          format: date-time
        lastChangedBy:
          oneOf:
            - $ref: '#/components/schemas/SyncActor'
            - type: 'null'
        payload:
          oneOf:
            - $ref: '#/components/schemas/GraphieDraftPayload'
            - type: 'null'
    EmployeeTaskRecoverySeedResponse:
      type: object
      additionalProperties: false
      required: [recovery]
      properties:
        recovery:
          oneOf:
            - $ref: '#/components/schemas/EmployeeTaskRecoverySeed'
            - type: 'null'
    EmployeeTaskRecoverySeed:
      type: object
      additionalProperties: false
      required: [recoveryId, source, seed, provenance]
      properties:
        recoveryId: { type: string, format: uuid }
        source:
          type: object
          additionalProperties: false
          required: [taskId, auditId, revision, employee]
          properties:
            taskId: { type: string, format: uuid }
            auditId: { type: string, format: uuid }
            revision: { type: integer, minimum: 1 }
            employee: { $ref: '#/components/schemas/SyncActor' }
        seed:
          type: object
          additionalProperties: false
          required: [revision, payload]
          properties:
            revision: { type: integer, minimum: 1 }
            payload: { $ref: '#/components/schemas/GraphieDraftPayload' }
        provenance:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [destinationField, sourceField, sourceTaskId, sourceAuditId, sourceRevision, origin]
            properties:
              destinationField: { type: string }
              sourceField: { type: string }
              sourceTaskId: { type: string, format: uuid }
              sourceAuditId: { type: string, format: uuid }
              sourceRevision: { type: integer, minimum: 1 }
              origin: { type: string, enum: [copied-from-recovery-source] }
    HealthResponse:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          const: ok
        version:
          type: string
          const: v1
    ApiError:
      type: object
      description: >-
        Error envelope. Codes include VALIDATION_ERROR, AUTHENTICATION_FAILED, FORBIDDEN, TASK_NOT_FOUND,
        PAYLOAD_TOO_LARGE, IDEMPOTENCY_KEY_REUSED, AUDIT_NOT_ACCEPTED, REPLACEMENT_ALREADY_EXISTS,
        TASK_ASSIGNEE_UNAVAILABLE, AI_UNAVAILABLE, SUMMARY_ALREADY_CONFIRMED, SUMMARY_CONFIRMED, SUMMARY_NOT_CONFIRMED, SUMMARY_DESIGNATED, CONFORMITY_ALREADY_DECIDED, CONFORMITY_NOT_DECIDED, REPORT_GENERATION_FAILED,
        REPORT_INPUTS_CHANGED, REPORT_ATTEMPT_CONFLICT, REPORT_FILE_NOT_READY, REPORT_FILE_ALREADY_ATTACHED, REPORT_CANDIDATE_NOT_READY, REPORT_CANDIDATE_OUTDATED, REPORT_ALREADY_OFFICIAL, REPORT_OFFICIAL_DESIGNATED, FILE_TOO_LARGE, UNSUPPORTED_FILE_TYPE, FILE_STORAGE_FAILED,
        FILE_ATTEMPT_CONFLICT, FILE_NOT_RESCANNABLE and INTERNAL_ERROR.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: object
                required: [path, message]
                properties:
                  path:
                    type: string
                  message:
                    type: string
