        ruleId: { type: string, minLength: 1 }
        ruleVersion: { type: integer, minimum: 1 }
        approvalReference: { type: string, minLength: 1 }
        registryVersion: { type: string, minLength: 1 }
        submissionId: { type: string, format: uuid }
        sourceKeys:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/InsightSourceKey'
        statement: { type: string, minLength: 1 }
        origin: { type: string, enum: [deterministic] }
    InsightProposalSet:
      description: >-
        Factual proposals from CETEM-approved insight rules. unavailable means no approved rule exists; available with an
        empty list means rules exist and none fired.
      oneOf:
        - type: object
          additionalProperties: false
          required: [status, reason, registryVersion, proposals]
          properties:
            status: { type: string, enum: [unavailable] }
            reason: { type: string, enum: [no-approved-rules] }
            registryVersion: { type: string, minLength: 1 }
            proposals:
              type: array
              maxItems: 0
              items:
                $ref: '#/components/schemas/InsightProposal'
        - type: object
          additionalProperties: false
          required: [status, registryVersion, proposals]
          properties:
            status: { type: string, enum: [available] }
            registryVersion: { type: string, minLength: 1 }
            proposals:
              type: array
              items:
                $ref: '#/components/schemas/InsightProposal'
    EmployeeTaskListResponse:
      type: object
      additionalProperties: false
      required: [tasks]
