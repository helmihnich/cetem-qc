      security:
        - bearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConformityDecisionRequest'
      responses:
        '201':
          description: Recorded decision (Cache-Control no-store)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConformityDecision'
