        '403': { description: Responsable role required (FORBIDDEN), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '404': { description: Malformed, unknown or another team's task, or no accepted submission (TASK_NOT_FOUND), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '409': { description: The summary is not confirmed (SUMMARY_NOT_CONFIRMED) or a decision already exists for it (CONFORMITY_ALREADY_DECIDED), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '422': { description: Missing or unknown outcome, or extra property (VALIDATION_FAILED), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '500': { description: Evidence inconsistent or decision not recorded (INTERNAL_ERROR), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /tasks/{taskId}/report-candidates:
    post:
      operationId: generateReportCandidate
      summary: Generate a Word report candidate from the current audit workflow inputs
      description: >-
        Responsable only. The body carries a client-generated attemptId only; actor and dates come from the session and
        the server clock. Generates one Word document, stores it privately and returns the candidate, which is bound
        immutably to the audit revision, the confirmed summary and the conformity decision. A candidate is never
        official in this story. The same attemptId for the same task replays the stored outcome (200 for a ready
        candidate, 502 for a failed one) without generating again. A malformed, unknown or another team's task, and an
        own-team task without accepted submission, all get the same 404.
      security:
        - bearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportCandidateRequest'
      responses:
        '200':
          description: Replay of an attempt that already produced a ready candidate (Cache-Control no-store)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportCandidate'
        '201':
          description: Generated candidate (Cache-Control no-store)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportCandidate'
        '401': { description: Session rejected, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '403': { description: Responsable role required (FORBIDDEN), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '404': { description: Malformed, unknown or another team's task, or no accepted submission (TASK_NOT_FOUND), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '409': { description: Summary not confirmed (SUMMARY_NOT_CONFIRMED), no current conformity decision (CONFORMITY_NOT_DECIDED), attempt used by another task (REPORT_ATTEMPT_CONFLICT) inputs changed during generation (REPORT_INPUTS_CHANGED) or an official report already designated (REPORT_OFFICIAL_DESIGNATED), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '422': { description: Missing or invalid attemptId, or extra property (VALIDATION_FAILED), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '500': { description: Evidence inconsistent or candidate not recorded (INTERNAL_ERROR), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '502': { description: Generation or storage failed; the attempt can be retried with a new attemptId (REPORT_GENERATION_FAILED), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    get:
      operationId: listReportCandidates
      summary: List the Word and PDF report candidates of a task, newest first
      description: >-
        Responsable only. The status of each candidate is derived on every read: a ready candidate whose bound summary
        or conformity decision is no longer current reads as outdated. A malformed, unknown or another team's task, and
        an own-team task without accepted submission, all get the same 404.
      security:
        - bearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Candidates, newest first (Cache-Control no-store)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportCandidateList'
        '401': { description: Session rejected, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '403': { description: Responsable role required (FORBIDDEN), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '404': { description: Malformed, unknown or another team's task, or no accepted submission (TASK_NOT_FOUND), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '500': { description: Candidates could not be loaded (INTERNAL_ERROR), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /tasks/{taskId}/pdf-files/{fileId}/report-candidate:
