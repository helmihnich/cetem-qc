openapi: 3.1.0
info:
  title: CETEM-QC API
  version: 1.0.0
  description: Versioned public HTTP contract. Internal identifiers and error codes are English.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check API availability
      parameters:
        - name: verbose
          in: query
          required: false
          schema:
            type: string
            enum: ["true", "false"]
      responses:
        '200':
          description: API is available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /authenticate:
    post:
      operationId: authenticateWithPassword
      summary: Authenticate with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthenticationRequest'
      responses:
        '200':
          description: Authenticated account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Credentials rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /session:
    get:
      operationId: getCurrentSession
      summary: Check current server session and activation state
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          description: Session rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Session belongs to a deactivated account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      operationId: logoutCurrentSession
      summary: Invalidate the current server session
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Session invalidated
        '401':
          description: Session rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /authenticate/password:
    post:
      operationId: replaceTemporaryPassword
      summary: Replace a temporary password
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordReplacementRequest'
      responses:
        '200':
          description: Password replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Credentials rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /employees:
    get:
      operationId: listOwnTeamEmployees
      summary: List employees in the authenticated Responsable's team
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Employees in the current Responsable's team
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeListResponse'
        '401':
          description: Session rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Responsable role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      operationId: createOwnTeamEmployee
      summary: Create an employee in the authenticated Responsable's team
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmployeeRequest'
      responses:
        '201':
          description: Employee created; credential is returned once for manual handover
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeCredentialResponse'
        '400':
          description: Invalid employee details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Session rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Responsable role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /employees/{employeeId}/credential:
    post:
      operationId: regenerateEmployeeCredential
      summary: Regenerate the temporary credential before employee activation
      security:
        - bearerAuth: []
      parameters:
        - name: employeeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Temporary credential regenerated and returned once
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeCredentialResponse'
        '401':
          description: Session rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Responsable role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Employee not found or already activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /employees/{employeeId}/status:
    patch:
      operationId: updateOwnTeamEmployeeStatus
      summary: Activate or deactivate an employee in the authenticated Responsable's team
      security:
        - bearerAuth: []
      parameters:
        - name: employeeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEmployeeStatusRequest'
      responses:
        '200':
          description: Employee status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateEmployeeStatusResponse'
        '400':
          description: Invalid employee status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Session rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Responsable role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Employee not found in the authenticated Responsable's team
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /employee/tasks:
    get:
      operationId: listAssignedEmployeeTasks
      summary: List tasks assigned to the authenticated employee
      description: Returns only tasks explicitly assigned to the authenticated Employé. Request query parameters are not supported.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Tasks assigned to the authenticated employee
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeTaskListResponse'
        '400':
          description: Unsupported query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Session rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Employé role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /employee/tasks/{taskId}:
    get:
      operationId: getAssignedEmployeeTask
      summary: Read a task assigned to the authenticated employee
      description: Request query parameters are not supported.
      security:
        - bearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Task assigned to the authenticated employee
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeTaskResponse'
        '401':
          description: Session rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Employé role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '400':
          description: Unsupported query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Task not found or not assigned to the authenticated employee
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /task-assignees:
    get:
      operationId: listTaskAssignees
      summary: List active employees eligible for the authenticated Responsable's team
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Eligible task assignees
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskAssigneeListResponse'
        '401':
          description: Session rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Responsable role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /tasks:
    get:
      operationId: listOwnTeamTasks
      summary: List tasks assigned within the authenticated Responsable's team
      description: Returns only task ID, type, establishment, assignee, state, and last-update timestamp. Request query parameters are not supported.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Tasks assigned within the authenticated Responsable's team
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskListResponse'
        '400':
          description: Unsupported query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Session rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Responsable role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      operationId: createAssignedTask
      summary: Create a Graphie Mobile task assigned to an eligible employee
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: Task created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          description: Invalid task details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Session rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Responsable role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Assignee is not an active employee in the Responsable's team
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  schemas:
    AuthenticationRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, minLength: 1 }
        password: { type: string, minLength: 1 }
    PasswordReplacementRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, minLength: 1 }
        newPassword: { type: string, minLength: 1 }
    AuthenticatedUser:
      type: object
      required: [id, email, displayName, role, mustChangePassword]
      properties:
        id: { type: string }
        email: { type: string }
        displayName: { type: string }
        role:
          type: string
          enum: [responsable, employe]
        mustChangePassword: { type: boolean }
    AuthenticationResponse:
      type: object
      required: [user, sessionExpiresAt, token]
      properties:
        user:
          $ref: '#/components/schemas/AuthenticatedUser'
        sessionExpiresAt: { type: string, format: date-time }
        token: { type: string, minLength: 1 }
    SessionResponse:
      type: object
      required: [user, sessionExpiresAt]
      properties:
        user:
          $ref: '#/components/schemas/AuthenticatedUser'
        sessionExpiresAt: { type: string, format: date-time }
    EmployeeListResponse:
      type: object
      required: [employees]
      properties:
        employees:
          type: array
          items:
            $ref: '#/components/schemas/TeamEmployee'
    TeamEmployee:
      type: object
      required: [id, firstName, surname, email, active]
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string }
        surname: { type: string }
        email: { type: string, format: email }
        active: { type: boolean }
    CreateEmployeeRequest:
      type: object
      required: [firstName, surname, email]
      additionalProperties: false
      properties:
        firstName: { type: string, minLength: 1, maxLength: 100 }
        surname: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email, minLength: 3, maxLength: 254 }
    EmployeeCredentialResponse:
      type: object
      required: [employee, temporaryCredential]
      properties:
        employee:
          $ref: '#/components/schemas/TeamEmployee'
        temporaryCredential: { type: string, minLength: 1 }
    UpdateEmployeeStatusRequest:
      type: object
      additionalProperties: false
      required: [active]
      properties:
        active: { type: boolean }
    UpdateEmployeeStatusResponse:
      type: object
      required: [employee]
      properties:
        employee:
          $ref: '#/components/schemas/TeamEmployee'
    TaskAssigneeListResponse:
      type: object
      required: [assignees]
      properties:
        assignees:
          type: array
          items:
            $ref: '#/components/schemas/TaskAssignee'
    TaskAssignee:
      type: object
      required: [id, firstName, surname]
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string }
        surname: { type: string }
    CreateTaskRequest:
      type: object
      additionalProperties: false
      required: [establishment, service, type, assigneeId]
      properties:
        establishment:
          type: string
          minLength: 1
          maxLength: 200
          description: Trimmed before validation; must contain a non-whitespace character and no NUL character.
          pattern: '^[^\u0000]*[^\s\u0000][^\u0000]*$'
        service:
          type: string
          maxLength: 200
          description: Must not contain a NUL character.
          pattern: '^[^\u0000]*$'
        type:
          type: string
          enum: [graphie_mobile]
        assigneeId: { type: string, format: uuid }
    TaskResponse:
      type: object
      required: [task]
      properties:
        task:
          $ref: '#/components/schemas/Task'
    Task:
      type: object
      required: [id, establishment, service, type, assigneeId, creatorId, createdAt, state]
      properties:
        id: { type: string, format: uuid }
        establishment: { type: string }
        service: { type: string }
        type:
          type: string
          enum: [graphie_mobile]
        assigneeId: { type: string, format: uuid }
        creatorId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        state:
          type: string
          const: draft
    TaskListResponse:
      type: object
      additionalProperties: false
      required: [tasks]
      properties:
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/TaskListItem'
    TaskListItem:
      type: object
      additionalProperties: false
      required: [id, type, establishment, assignee, state, lastUpdatedAt]
      properties:
        id: { type: string, format: uuid }
        type:
          type: string
          enum: [graphie_mobile]
        establishment: { type: string }
        assignee: { type: string }
        state:
          type: string
          const: draft
        lastUpdatedAt: { type: string, format: date-time }
    EmployeeTaskListResponse:
      type: object
      additionalProperties: false
      required: [tasks]
      properties:
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/EmployeeTaskListItem'
    EmployeeTaskListItem:
      type: object
      additionalProperties: false
      required: [id, type, establishment, service, state, createdAt]
      properties:
        id: { type: string, format: uuid }
        type:
          type: string
          enum: [graphie_mobile]
        establishment: { type: string }
        service: { type: string }
        state:
          type: string
          const: draft
        createdAt: { type: string, format: date-time }
    EmployeeTaskResponse:
      type: object
      additionalProperties: false
      required: [task]
      properties:
        task:
          $ref: '#/components/schemas/EmployeeTaskListItem'
    HealthResponse:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          const: ok
        version:
          type: string
          const: v1
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: object
                required: [path, message]
                properties:
                  path:
                    type: string
                  message:
                    type: string
