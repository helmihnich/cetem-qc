        '403': { description: Responsable role required (FORBIDDEN), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '404': { description: No official report, or malformed, unknown or another team's task (TASK_NOT_FOUND), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '500': { description: Official report could not be loaded (INTERNAL_ERROR), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /tasks/{taskId}/report-candidates/{candidateId}/file:
    get:
      operationId: downloadReportCandidateFile
      summary: Download the stored Word or PDF file of a candidate for inspection
      description: >-
        Responsable only, owning team only. Available for a candidate whose outcome retained a file (ready or outdated).
        The response is an attachment with Cache-Control no-store and X-Content-Type-Options nosniff. Any other case,
        including a failed or generating candidate and another team's candidate, gets the same 404 as an unknown task.
      security:
        - bearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: candidateId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The Word document or the uploaded PDF (Content-Disposition attachment, Cache-Control no-store, X-Content-Type-Options nosniff)
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema: { type: string, format: binary }
            application/pdf:
              schema: { type: string, format: binary }
        '401': { description: Session rejected, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '403': { description: Responsable role required (FORBIDDEN), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '404': { description: Malformed, unknown, other team's, failed or generating candidate, or unknown task (TASK_NOT_FOUND), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '500': { description: The stored file could not be read (INTERNAL_ERROR), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /history:
    get:
      operationId: listHistory
      summary: List the completed controls the authenticated user may consult (read only)
      description: >-
        Responsable (own team) or Employé (currently assigned). A control is completed when it has an official report.
        Newest designation first. Nothing is written. Request query parameters are not supported.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Completed controls (Cache-Control no-store)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryListResponse'
        '400': { description: Unsupported query parameters (VALIDATION_ERROR), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '401': { description: Session rejected, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '500': { description: History could not be loaded (INTERNAL_ERROR), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /history/{taskId}:
    get:
      operationId: getHistoryRecord
      summary: Read one completed control (read only)
      description: >-
        Responsable (own team) or Employé (currently assigned). Returns the stored evidence, insights with decisions,
        confirmed summary, human conformity decision, official report and lineage. Nothing is written. A malformed,
        unknown or unauthorized task, and a task without accepted evidence or official report, all get the same 404.
      security:
        - bearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The completed control (Cache-Control no-store)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryRecordResponse'
        '401': { description: Session rejected, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '404': { description: Malformed, unknown or unauthorized task, or not completed (TASK_NOT_FOUND); the cases are not told apart, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '500': { description: Stored evidence inconsistent or not loadable (INTERNAL_ERROR), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /history/{taskId}/official-report/file:
    get:
      operationId: downloadOfficialReport
      summary: Download the official report file of a completed control
      description: >-
        Responsable (own team) or Employé (currently assigned). Serves the stored bytes of the official candidate only,
        after checking their SHA-256. The response is an attachment with Cache-Control no-store and
        X-Content-Type-Options nosniff. No URL or storage key is returned.
      security:
        - bearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The official Word document or PDF
          headers:
            Content-Disposition: { schema: { type: string } }
            Content-Length: { schema: { type: integer } }
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema: { type: string, format: binary }
            application/pdf:
              schema: { type: string, format: binary }
        '401': { description: Session rejected, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '404': { description: Malformed, unknown or unauthorized task, or not completed (TASK_NOT_FOUND), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '409': { description: The official PDF is no longer ready (REPORT_FILE_NOT_READY); no bytes are served, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '500': { description: Stored bytes missing or altered (INTERNAL_ERROR); no bytes are served, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /tasks/{taskId}/pdf-files:
    post:
      operationId: uploadManualPdfFile
      summary: Upload a manually prepared PDF report for validation, scanning and private storage
      description: >-
        Responsable only, for a task whose summary is confirmed and whose conformity decision is current. The body is the
        raw PDF (Content-Type application/pdf, 20 MB maximum by default); X-Attempt-Id is a client-generated UUID and
        X-File-Name an optional display name. The file is validated on the server (the declared type is never trusted)
        and scanned through the configured antivirus adapter. Any file that reached validation returns a StoredFile
        with its status, including rejected, quarantined and scan-failed ones. The same attempt for the same task
        replays the stored file (200). A stored file is never official in this story and no report property exists.
      security:
        - bearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: X-Attempt-Id
          in: header
          required: true
          schema: { type: string, format: uuid }
        - name: X-File-Name
          in: header
          required: false
          schema: { type: string, maxLength: 1024 }
      requestBody:
        required: true
        content:
          application/pdf:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Replay of an attempt that already stored a file (Cache-Control no-store)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoredFile'
        '201':
          description: The file was recorded with its validation and scan status (Cache-Control no-store)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoredFile'
        '401': { description: Session rejected, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '403': { description: Responsable role required (FORBIDDEN), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '404': { description: Malformed, unknown or another team's task, or no accepted submission (TASK_NOT_FOUND), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '409': { description: Summary not confirmed (SUMMARY_NOT_CONFIRMED), no current conformity decision (CONFORMITY_NOT_DECIDED) or attempt used by another task (FILE_ATTEMPT_CONFLICT), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '413': { description: The file is larger than the configured limit (FILE_TOO_LARGE), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '415': { description: The media type is not application/pdf (UNSUPPORTED_FILE_TYPE), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '422': { description: Empty body or missing or invalid X-Attempt-Id (VALIDATION_FAILED), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '500': { description: The file could not be processed (INTERNAL_ERROR), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '502': { description: The binary could not be stored; retry with a new attempt ID (FILE_STORAGE_FAILED), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    get:
      operationId: listManualPdfFiles
      summary: List the uploaded PDF files of a task with their validation and scan status, newest first
      description: >-
        Responsable only, owning team only. No report eligibility is needed, so the history stays visible after a
        reopening. A malformed, unknown or another team's task all get the same 404.
      security:
        - bearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Files, newest first (Cache-Control no-store)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoredFileList'
        '401': { description: Session rejected, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '403': { description: Responsable role required (FORBIDDEN), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '404': { description: Malformed, unknown or another team's task, or no accepted submission (TASK_NOT_FOUND), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '500': { description: Files could not be loaded (INTERNAL_ERROR), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /tasks/{taskId}/pdf-files/{fileId}/content:
    get:
      operationId: downloadManualPdfFile
      summary: Download a ready PDF file for inspection
      description: >-
        Responsable only, owning team only, and only for a file whose status is ready. The response is an attachment with
        Cache-Control no-store and X-Content-Type-Options nosniff. Any other status, an unknown, malformed or another
        team's file gets the same 404 as an unknown task.
      security:
        - bearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: fileId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The PDF (Content-Disposition attachment, Cache-Control no-store, X-Content-Type-Options nosniff)
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '401': { description: Session rejected, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '403': { description: Responsable role required (FORBIDDEN), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '404': { description: Malformed, unknown, other team's or not ready file, or unknown task (TASK_NOT_FOUND), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '500': { description: The stored file could not be read (INTERNAL_ERROR), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /tasks/{taskId}/pdf-files/{fileId}/scan-retries:
    post:
      operationId: retryManualPdfScan
      summary: Re-scan a PDF file whose scan failed or is pending
      description: >-
        Responsable only, owning team only. Only a scan-failed or scan-pending file can be re-scanned; the new scan result
        is appended. A quarantined, rejected, storage-failed or ready file answers 409.
      security:
        - bearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: fileId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The file with its new status (Cache-Control no-store)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoredFile'
        '401': { description: Session rejected, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '403': { description: Responsable role required (FORBIDDEN), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '404': { description: Malformed, unknown or another team's task or file (TASK_NOT_FOUND), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '409': { description: The file cannot be re-scanned (FILE_NOT_RESCANNABLE), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '500': { description: The scan could not be recorded (INTERNAL_ERROR), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  schemas:
    AuthenticationRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, minLength: 1 }
        password: { type: string, minLength: 1 }
    PasswordReplacementRequest:
      type: object
      required: [newPassword]
      description: The activation session already proves the temporary credential; currentPassword is optional and checked only when sent.
      properties:
        currentPassword: { type: string, minLength: 1 }
        newPassword: { type: string, minLength: 1 }
    AuthenticatedUser:
      type: object
      required: [id, email, displayName, role, mustChangePassword]
      properties:
        id: { type: string }
        email: { type: string }
        displayName: { type: string }
        role:
          type: string
          enum: [responsable, employe]
        mustChangePassword: { type: boolean }
    AuthenticationResponse:
      type: object
      required: [user, sessionExpiresAt, token]
      properties:
        user:
          $ref: '#/components/schemas/AuthenticatedUser'
        sessionExpiresAt: { type: string, format: date-time }
        token: { type: string, minLength: 1 }
    SessionResponse:
      type: object
      required: [user, sessionExpiresAt]
      properties:
        user:
          $ref: '#/components/schemas/AuthenticatedUser'
        sessionExpiresAt: { type: string, format: date-time }
    EmployeeListResponse:
      type: object
      required: [employees]
      properties:
        employees:
          type: array
          items:
            $ref: '#/components/schemas/TeamEmployee'
    TeamEmployee:
      type: object
      required: [id, firstName, surname, email, active]
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string }
        surname: { type: string }
        email: { type: string, format: email }
        active: { type: boolean }
    CreateEmployeeRequest:
      type: object
      required: [firstName, surname, email]
      additionalProperties: false
      properties:
        firstName: { type: string, minLength: 1, maxLength: 100 }
        surname: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email, minLength: 3, maxLength: 254 }
    EmployeeCredentialResponse:
      type: object
      required: [employee, temporaryCredential]
      properties:
        employee:
          $ref: '#/components/schemas/TeamEmployee'
        temporaryCredential: { type: string, minLength: 1 }
    UpdateEmployeeStatusRequest:
      type: object
      additionalProperties: false
      required: [active]
      properties:
        active: { type: boolean }
    UpdateEmployeeStatusResponse:
      type: object
      required: [employee]
      properties:
        employee:
          $ref: '#/components/schemas/TeamEmployee'
    TaskAssigneeListResponse:
      type: object
      required: [assignees]
      properties:
        assignees:
          type: array
          items:
            $ref: '#/components/schemas/TaskAssignee'
    TaskAssignee:
      type: object
      required: [id, firstName, surname]
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string }
        surname: { type: string }
    CreateTaskRequest:
      type: object
      additionalProperties: false
      required: [establishment, service, type, assigneeId]
      properties:
        establishment:
          type: string
          minLength: 1
          maxLength: 200
          description: Trimmed before validation; must contain a non-whitespace character and no NUL character.
          pattern: '^[^\u0000]*[^\s\u0000][^\u0000]*$'
        service:
          type: string
          maxLength: 200
          description: Must not contain a NUL character.
          pattern: '^[^\u0000]*$'
        type:
          type: string
          enum: [graphie_mobile]
        assigneeId: { type: string, format: uuid }
    TaskResponse:
      type: object
      required: [task]
      properties:
        task:
          $ref: '#/components/schemas/Task'
    Task:
      type: object
      required: [id, establishment, service, type, assigneeId, creatorId, createdAt, state]
      properties:
        id: { type: string, format: uuid }
        establishment: { type: string }
        service: { type: string }
        type:
          type: string
          enum: [graphie_mobile]
        assigneeId: { type: string, format: uuid }
        creatorId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        state:
          type: string
          const: draft
    ReplacementTaskResponse:
      type: object
      additionalProperties: false
      required: [task, replacementOf]
      properties:
        task:
          $ref: '#/components/schemas/Task'
        replacementOf:
          type: object
          additionalProperties: false
          required: [taskId, auditId]
          properties:
            taskId: { type: string, format: uuid }
            auditId: { type: string, format: uuid }
    TaskListResponse:
      type: object
      additionalProperties: false
      required: [tasks]
      properties:
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/TaskListItem'
    ReassignUnstartedTaskRequest:
      type: object
      additionalProperties: false
      required: [successorId, expectedAssignmentVersion]
      properties:
        successorId: { type: string, format: uuid }
        expectedAssignmentVersion: { type: integer, minimum: 1 }
    ReassignUnstartedTaskResponse:
      type: object
      additionalProperties: false
      required: [taskId, assigneeId, assignmentVersion]
      properties:
        taskId: { type: string, format: uuid }
        assigneeId: { type: string, format: uuid }
        assignmentVersion: { type: integer, minimum: 1 }
    CreateDeactivatedAssigneeRecoveryRequest:
      type: object
      additionalProperties: false
      required: [successorId, expectedAssignmentVersion, sourceRevision]
      properties:
        successorId: { type: string, format: uuid }
        expectedAssignmentVersion: { type: integer, minimum: 1 }
        sourceRevision: { type: integer, minimum: 1 }
    DeactivatedAssigneeRecoveryResponse:
      type: object
      additionalProperties: false
      required: [task, recoveryId, recoveryKind, source]
      properties:
        task:
          $ref: '#/components/schemas/Task'
        recoveryId: { type: string, format: uuid }
        recoveryKind:
          type: string
          enum: [synchronized-draft, correction-draft]
        source:
          type: object
          additionalProperties: false
          required: [taskId, auditId, revision]
          properties:
            taskId: { type: string, format: uuid }
            auditId: { type: string, format: uuid }
            revision: { type: integer, minimum: 1 }
    TaskListItem:
      type: object
      additionalProperties: false
      required: [id, type, establishment, assignee, assigneeActive, assignmentVersion, assignmentHistory, recoveryState, recoveryRevision, recoverySource, recoverySuccessorTaskId, state, lastUpdatedAt, replacementOf, replacedBy]
      properties:
        id: { type: string, format: uuid }
        type:
          type: string
          enum: [graphie_mobile]
        establishment: { type: string }
        assignee: { type: string }
        assigneeActive: { type: boolean }
        assignmentVersion: { type: integer, minimum: 1 }
        assignmentHistory:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [previousEmployee, newEmployee, actor, reason, createdAt]
            properties:
              previousEmployee: { type: [string, 'null'] }
              newEmployee: { type: string }
              actor: { type: string }
              reason: { type: string }
              createdAt: { type: string, format: date-time }
        recoveryState:
          type: [string, 'null']
          enum: [unstarted, synchronized-draft, correction-draft, resolution-required, accepted, recovered, null]
        recoveryRevision:
          type: [integer, 'null']
          minimum: 1
        recoverySource:
          oneOf:
            - type: object
              additionalProperties: false
              required: [taskId, auditId, revision]
              properties:
                taskId: { type: string, format: uuid }
                auditId: { type: string, format: uuid }
                revision: { type: integer, minimum: 1 }
            - type: 'null'
        recoverySuccessorTaskId:
          type: [string, 'null']
          format: uuid
        state:
          type: string
          enum: [draft, submitted]
          description: submitted when the task's audit was accepted by the server; draft otherwise.
        lastUpdatedAt: { type: string, format: date-time }
        replacementOf:
          type: [string, 'null']
          format: uuid
          description: The original task ID when this task is a replacement control.
        replacedBy:
          type: [string, 'null']
          format: uuid
          description: The replacement task ID when this task's accepted audit was replaced.
    AcceptedEvidenceResponse:
      type: object
      additionalProperties: false
      required: [task, submission, identity, values, results, lineage, insights, insightDecisions, manualInsights, summary, summaryHistory, summaryVersion, conformityDecision, conformityHistory]
      properties:
        conformityDecision:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/ConformityDecision'
        conformityHistory:
          type: array
          description: Earlier conformity decisions made historical by a reopening, newest first.
          items:
            $ref: '#/components/schemas/ConformityHistoryItem'
        summaryHistory:
          type: array
          description: Earlier reopened versions of the summary, newest first.
          items:
            $ref: '#/components/schemas/SummaryHistoryItem'
        summaryVersion:
          type: object
          additionalProperties: false
          required: [number, state]
          properties:
            number: { type: integer, minimum: 1 }
            state: { type: string, enum: [confirmed, open] }
        manualInsights:
          type: array
          items:
            $ref: '#/components/schemas/ManualInsight'
        summary:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/ConfirmedSummary'
        insights:
          $ref: '#/components/schemas/InsightProposalSet'
        insightDecisions:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceInsightDecision'
        task:
          type: object
          additionalProperties: false
          required: [id, establishment, service, assignee]
          properties:
            id: { type: string, format: uuid }
            establishment: { type: string }
            service: { type: string }
            assignee: { type: string }
        submission:
          type: object
          additionalProperties: false
          required: [submissionId, auditId, revision, submittedBy, acceptedAt]
          properties:
            submissionId: { type: string, format: uuid }
            auditId: { type: string, format: uuid }
            revision: { type: integer, minimum: 1 }
            submittedBy:
              type: object
              additionalProperties: false
              required: [id, displayName]
              properties:
                id: { type: string, format: uuid }
                displayName: { type: string }
            acceptedAt: { type: string, format: date-time }
        identity:
          type: object
          additionalProperties: false
          required: [catalogueId, catalogueVersion, schemaVersion, ruleId, ruleVersion]
          properties:
            catalogueId: { type: string }
            catalogueVersion: { type: string }
            schemaVersion: { type: integer }
            ruleId: { type: string }
            ruleVersion: { type: string }
        values:
          type: object
          description: The stored payload values, strings unchanged.
          additionalProperties: { type: string }
        results:
          type: object
          description: >-
            The server calculation snapshot as stored, one entry per paper test (voltageAccuracy, voltageRepeatability,
            outputRepeatability, outputLinearity, lightFieldCorrespondence). The shape is owned by packages/domain.
          required: [voltageAccuracy, voltageRepeatability, outputRepeatability, outputLinearity, lightFieldCorrespondence]
          additionalProperties: false
          properties:
            voltageAccuracy: { type: object, additionalProperties: true }
            voltageRepeatability: { type: object, additionalProperties: true }
            outputRepeatability: { type: object, additionalProperties: true }
            outputLinearity: { type: object, additionalProperties: true }
            lightFieldCorrespondence: { type: object, additionalProperties: true }
        lineage:
          type: object
          additionalProperties: false
          required: [replacementOf, replacedBy, recoverySource, recoverySuccessorTaskId]
          properties:
            replacementOf: { type: [string, 'null'], format: uuid }
            replacedBy: { type: [string, 'null'], format: uuid }
            recoverySource:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [taskId, auditId, revision]
                  properties:
                    taskId: { type: string, format: uuid }
                    auditId: { type: string, format: uuid }
                    revision: { type: integer, minimum: 1 }
                - type: 'null'
