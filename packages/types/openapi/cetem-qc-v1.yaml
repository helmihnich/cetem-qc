openapi: 3.1.0
info:
  title: CETEM-QC API
  version: 1.0.0
  description: Versioned public HTTP contract. Internal identifiers and error codes are English.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check API availability
      parameters:
        - name: verbose
          in: query
          required: false
          schema:
            type: string
            enum: ["true", "false"]
      responses:
        '200':
          description: API is available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /authenticate:
    post:
      operationId: authenticateWithPassword
      summary: Authenticate with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthenticationRequest'
      responses:
        '200':
          description: Authenticated account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Credentials rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /session:
    get:
      operationId: getCurrentSession
      summary: Check current server session and activation state
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          description: Session rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Session belongs to a deactivated account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      operationId: logoutCurrentSession
      summary: Invalidate the current server session
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Session invalidated
        '401':
          description: Session rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /authenticate/password:
    post:
      operationId: replaceTemporaryPassword
      summary: Replace a temporary password
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordReplacementRequest'
      responses:
        '200':
          description: Password replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Credentials rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /employees:
    get:
      operationId: listOwnTeamEmployees
      summary: List employees in the authenticated Responsable's team
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Employees in the current Responsable's team
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeListResponse'
        '401':
          description: Session rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Responsable role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      operationId: createOwnTeamEmployee
      summary: Create an employee in the authenticated Responsable's team
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmployeeRequest'
      responses:
        '201':
          description: Employee created; credential is returned once for manual handover
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeCredentialResponse'
        '400':
          description: Invalid employee details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Session rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Responsable role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /employees/{employeeId}/credential:
    post:
      operationId: regenerateEmployeeCredential
      summary: Regenerate the temporary credential before employee activation
      security:
        - bearerAuth: []
      parameters:
        - name: employeeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Temporary credential regenerated and returned once
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeCredentialResponse'
        '401':
          description: Session rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Responsable role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Employee not found or already activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /employees/{employeeId}/password-reset:
    post:
      operationId: resetEmployeePassword
      summary: Reset the password of an active own-team employee, forcing a password change and revoking sessions
      security:
        - bearerAuth: []
      parameters:
        - name: employeeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Password reset; the new temporary credential is returned once
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeCredentialResponse'
        '401':
          description: Session rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Responsable role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Employee not found in the caller's team
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Employee is deactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /employees/{employeeId}/status:
    patch:
      operationId: updateOwnTeamEmployeeStatus
      summary: Activate or deactivate an employee in the authenticated Responsable's team
      security:
        - bearerAuth: []
      parameters:
        - name: employeeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEmployeeStatusRequest'
      responses:
        '200':
          description: Employee status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateEmployeeStatusResponse'
        '400':
          description: Invalid employee status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Session rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Responsable role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Employee not found in the authenticated Responsable's team
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /employee/tasks:
    get:
      operationId: listAssignedEmployeeTasks
      summary: List tasks assigned to the authenticated employee
      description: Returns only tasks explicitly assigned to the authenticated Employé. Request query parameters are not supported.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Tasks assigned to the authenticated employee
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeTaskListResponse'
        '400':
          description: Unsupported query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Session rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Employé role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /employee/tasks/{taskId}:
    get:
      operationId: getAssignedEmployeeTask
      summary: Read a task assigned to the authenticated employee
      description: Request query parameters are not supported.
      security:
        - bearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Task assigned to the authenticated employee
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeTaskResponse'
        '401':
          description: Session rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Employé role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '400':
          description: Unsupported query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Task not found or not assigned to the authenticated employee
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /employee/tasks/{taskId}/audit-version:
    get:
      operationId: getEmployeeTaskAuditVersion
      summary: Read the current server version of an assigned task's audit
      description: >-
        Returns the latest audit revision (metadata and payload) so the Employé can resolve a synchronization
        conflict explicitly. Revision 0, state draft and null fields when no operation was accepted yet.
        Nothing is written.
      security:
        - bearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Current server version of the audit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeTaskAuditVersion'
        '401':
          description: Session rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Employé role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Task not found or not assigned to the authenticated employee
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /employee/tasks/{taskId}/recovery-seed:
    get:
      operationId: getEmployeeTaskRecoverySeed
      summary: Read an assigned recovery draft seed with source provenance
      description: Returns a recovery seed only to the employee currently assigned to its successor task. Ordinary assigned tasks return recovery null. The source employee remains attributed and every copied field includes immutable source provenance.
      security:
        - bearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Recovery seed and copied-field provenance, or null for an ordinary task
          headers:
            Cache-Control: { schema: { type: string } }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeTaskRecoverySeedResponse'
        '401':
          description: Session rejected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '403':
          description: Employé role required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404':
          description: Task not found or not assigned to the authenticated employee
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '500':
          description: Internal error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /employee/tasks/{taskId}/draft-syncs:
    post:
      operationId: syncEmployeeTaskDraft
      summary: Synchronize a saved draft of an assigned task as a new server revision
      description: >-
        Idempotent by idempotencyKey. Accepted, rejected and conflict outcomes are stored and replayed
        byte-equal for the same actor and request. Request bodies are limited to 256 kB.
      security:
        - bearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncOperationRequest'
      responses:
        '200':
          description: Operation accepted (or replayed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncOperationAccepted'
        '400':
          description: Invalid request envelope (not stored)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Session rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Employé role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Task not found or not assigned to the authenticated employee
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Stale base revision; nothing was written except the stored outcome
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncOperationConflict'
        '413':
          description: Request body too large (PAYLOAD_TOO_LARGE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Payload rejected (stored outcome), or IDEMPOTENCY_KEY_REUSED (ApiError, not stored)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SyncOperationRejected'
                  - $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /employee/tasks/{taskId}/submissions:
    post:
      operationId: submitEmployeeTaskAudit
      summary: Submit an assigned task's audit; the server accepts exactly one submission per audit
      description: >-
        Idempotent by idempotencyKey. On acceptance the server records the revision, the accepted submission
        with the submitting actor and server date, and its own calculation results in one transaction.
        Request bodies are limited to 256 kB.
      security:
        - bearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncOperationRequest'
      responses:
        '200':
          description: Submission accepted (or replayed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncOperationAccepted'
        '400':
          description: Invalid request envelope (not stored)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Session rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Employé role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Task not found or not assigned to the authenticated employee
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Stale base revision; nothing was written except the stored outcome
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncOperationConflict'
        '413':
          description: Request body too large (PAYLOAD_TOO_LARGE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Payload rejected (stored outcome), or IDEMPOTENCY_KEY_REUSED (ApiError, not stored)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SyncOperationRejected'
                  - $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /task-assignees:
    get:
      operationId: listTaskAssignees
      summary: List active employees eligible for the authenticated Responsable's team
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Eligible task assignees
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskAssigneeListResponse'
        '401':
          description: Session rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Responsable role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /tasks:
    get:
      operationId: listOwnTeamTasks
      summary: List tasks assigned within the authenticated Responsable's team
      description: Returns only task ID, type, establishment, assignee, state, and last-update timestamp. Request query parameters are not supported.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Tasks assigned within the authenticated Responsable's team
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskListResponse'
        '400':
          description: Unsupported query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Session rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Responsable role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      operationId: createAssignedTask
      summary: Create a Graphie Mobile task assigned to an eligible employee
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: Task created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          description: Invalid task details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Session rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Responsable role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Assignee is not an active employee in the Responsable's team
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /tasks/{taskId}/replacements:
    post:
      operationId: createReplacementControl
      summary: Create a replacement control linked to a server-accepted audit
      description: >-
        Responsable only. Creates, in one transaction, a new draft Graphie Mobile task assigned like POST /tasks and one
        insert-only `replacement-control` link to the accepted audit of the own-team task `taskId`. The original task,
        audit and evidence are never written. One replacement per original. Nothing is copied from the original.
      security:
        - bearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          description: The task holding the accepted audit to replace.
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: Replacement task and lineage link created (Cache-Control no-store)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplacementTaskResponse'
        '400':
          description: Invalid task details (VALIDATION_ERROR)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Session rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Responsable role required (FORBIDDEN)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: >-
            Malformed, unknown or another team's task (TASK_NOT_FOUND); the cases are not told apart.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: >-
            The task has no server-accepted audit (AUDIT_NOT_ACCEPTED) or already has a replacement
            (REPLACEMENT_ALREADY_EXISTS).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Assignee is not an active employee in the Responsable's team (TASK_ASSIGNEE_UNAVAILABLE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /tasks/{taskId}/deactivated-assignee-reassignment:
    post:
      operationId: reassignUnstartedDeactivatedTask
      summary: Reassign an unstarted task from a deactivated employee
      description: Responsable only. The task must be in the authenticated own team, the old assignee inactive, the successor active in that team, and server state must show no audit or unresolved submission outcome. The assignment version is checked in the mutation transaction. A tablet may still hold unsynchronized work.
      security:
        - bearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReassignUnstartedTaskRequest'
      responses:
        '200':
          description: Assignment changed and history recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReassignUnstartedTaskResponse'
        '400': { description: Invalid request, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '401': { description: Session rejected, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '403': { description: Responsable role required, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '404': { description: Task not found in own team, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '409': { description: Task state changed, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '422': { description: Successor is not an active same-team Employe, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /tasks/{taskId}/deactivated-assignee-recovery:
    post:
      operationId: createDeactivatedAssigneeRecovery
      summary: Create separate recovery work from a synchronized draft owned by a deactivated employee
      description: Creates a new task, draft audit, immutable deactivated-assignee-recovery link, and per-field copied-value provenance. Source task/audit/revisions remain unchanged.
      security:
        - bearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeactivatedAssigneeRecoveryRequest'
      responses:
        '201':
          description: New recovery task and source provenance created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeactivatedAssigneeRecoveryResponse'
        '400': { description: Invalid request, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '401': { description: Session rejected, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '403': { description: Responsable role required, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '404': { description: Task not found in own team, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '409': { description: Source changed, is not recoverable, or has already been recovered, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '422': { description: Successor is not an active same-team Employe, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  schemas:
    AuthenticationRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, minLength: 1 }
        password: { type: string, minLength: 1 }
    PasswordReplacementRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, minLength: 1 }
        newPassword: { type: string, minLength: 1 }
    AuthenticatedUser:
      type: object
      required: [id, email, displayName, role, mustChangePassword]
      properties:
        id: { type: string }
        email: { type: string }
        displayName: { type: string }
        role:
          type: string
          enum: [responsable, employe]
        mustChangePassword: { type: boolean }
    AuthenticationResponse:
      type: object
      required: [user, sessionExpiresAt, token]
      properties:
        user:
          $ref: '#/components/schemas/AuthenticatedUser'
        sessionExpiresAt: { type: string, format: date-time }
        token: { type: string, minLength: 1 }
    SessionResponse:
      type: object
      required: [user, sessionExpiresAt]
      properties:
        user:
          $ref: '#/components/schemas/AuthenticatedUser'
        sessionExpiresAt: { type: string, format: date-time }
    EmployeeListResponse:
      type: object
      required: [employees]
      properties:
        employees:
          type: array
          items:
            $ref: '#/components/schemas/TeamEmployee'
    TeamEmployee:
      type: object
      required: [id, firstName, surname, email, active]
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string }
        surname: { type: string }
        email: { type: string, format: email }
        active: { type: boolean }
    CreateEmployeeRequest:
      type: object
      required: [firstName, surname, email]
      additionalProperties: false
      properties:
        firstName: { type: string, minLength: 1, maxLength: 100 }
        surname: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email, minLength: 3, maxLength: 254 }
    EmployeeCredentialResponse:
      type: object
      required: [employee, temporaryCredential]
      properties:
        employee:
          $ref: '#/components/schemas/TeamEmployee'
        temporaryCredential: { type: string, minLength: 1 }
    UpdateEmployeeStatusRequest:
      type: object
      additionalProperties: false
      required: [active]
      properties:
        active: { type: boolean }
    UpdateEmployeeStatusResponse:
      type: object
      required: [employee]
      properties:
        employee:
          $ref: '#/components/schemas/TeamEmployee'
    TaskAssigneeListResponse:
      type: object
      required: [assignees]
      properties:
        assignees:
          type: array
          items:
            $ref: '#/components/schemas/TaskAssignee'
    TaskAssignee:
      type: object
      required: [id, firstName, surname]
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string }
        surname: { type: string }
    CreateTaskRequest:
      type: object
      additionalProperties: false
      required: [establishment, service, type, assigneeId]
      properties:
        establishment:
          type: string
          minLength: 1
          maxLength: 200
          description: Trimmed before validation; must contain a non-whitespace character and no NUL character.
          pattern: '^[^\u0000]*[^\s\u0000][^\u0000]*$'
        service:
          type: string
          maxLength: 200
          description: Must not contain a NUL character.
          pattern: '^[^\u0000]*$'
        type:
          type: string
          enum: [graphie_mobile]
        assigneeId: { type: string, format: uuid }
    TaskResponse:
      type: object
      required: [task]
      properties:
        task:
          $ref: '#/components/schemas/Task'
    Task:
      type: object
      required: [id, establishment, service, type, assigneeId, creatorId, createdAt, state]
      properties:
        id: { type: string, format: uuid }
        establishment: { type: string }
        service: { type: string }
        type:
          type: string
          enum: [graphie_mobile]
        assigneeId: { type: string, format: uuid }
        creatorId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        state:
          type: string
          const: draft
    ReplacementTaskResponse:
      type: object
      additionalProperties: false
      required: [task, replacementOf]
      properties:
        task:
          $ref: '#/components/schemas/Task'
        replacementOf:
          type: object
          additionalProperties: false
          required: [taskId, auditId]
          properties:
            taskId: { type: string, format: uuid }
            auditId: { type: string, format: uuid }
    TaskListResponse:
      type: object
      additionalProperties: false
      required: [tasks]
      properties:
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/TaskListItem'
    ReassignUnstartedTaskRequest:
      type: object
      additionalProperties: false
      required: [successorId, expectedAssignmentVersion]
      properties:
        successorId: { type: string, format: uuid }
        expectedAssignmentVersion: { type: integer, minimum: 1 }
    ReassignUnstartedTaskResponse:
      type: object
      additionalProperties: false
      required: [taskId, assigneeId, assignmentVersion]
      properties:
        taskId: { type: string, format: uuid }
        assigneeId: { type: string, format: uuid }
        assignmentVersion: { type: integer, minimum: 1 }
    CreateDeactivatedAssigneeRecoveryRequest:
      type: object
      additionalProperties: false
      required: [successorId, expectedAssignmentVersion, sourceRevision]
      properties:
        successorId: { type: string, format: uuid }
        expectedAssignmentVersion: { type: integer, minimum: 1 }
        sourceRevision: { type: integer, minimum: 1 }
    DeactivatedAssigneeRecoveryResponse:
      type: object
      additionalProperties: false
      required: [task, recoveryId, recoveryKind, source]
      properties:
        task:
          $ref: '#/components/schemas/Task'
        recoveryId: { type: string, format: uuid }
        recoveryKind:
          type: string
          enum: [synchronized-draft, correction-draft]
        source:
          type: object
          additionalProperties: false
          required: [taskId, auditId, revision]
          properties:
            taskId: { type: string, format: uuid }
            auditId: { type: string, format: uuid }
            revision: { type: integer, minimum: 1 }
    TaskListItem:
      type: object
      additionalProperties: false
      required: [id, type, establishment, assignee, assigneeActive, assignmentVersion, assignmentHistory, recoveryState, recoveryRevision, recoverySource, recoverySuccessorTaskId, state, lastUpdatedAt, replacementOf, replacedBy]
      properties:
        id: { type: string, format: uuid }
        type:
          type: string
          enum: [graphie_mobile]
        establishment: { type: string }
        assignee: { type: string }
        assigneeActive: { type: boolean }
        assignmentVersion: { type: integer, minimum: 1 }
        assignmentHistory:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [previousEmployee, newEmployee, actor, reason, createdAt]
            properties:
              previousEmployee: { type: [string, 'null'] }
              newEmployee: { type: string }
              actor: { type: string }
              reason: { type: string }
              createdAt: { type: string, format: date-time }
        recoveryState:
          type: [string, 'null']
          enum: [unstarted, synchronized-draft, correction-draft, resolution-required, accepted, recovered, null]
        recoveryRevision:
          type: [integer, 'null']
          minimum: 1
        recoverySource:
          oneOf:
            - type: object
              additionalProperties: false
              required: [taskId, auditId, revision]
              properties:
                taskId: { type: string, format: uuid }
                auditId: { type: string, format: uuid }
                revision: { type: integer, minimum: 1 }
            - type: 'null'
        recoverySuccessorTaskId:
          type: [string, 'null']
          format: uuid
        state:
          type: string
          enum: [draft, submitted]
          description: submitted when the task's audit was accepted by the server; draft otherwise.
        lastUpdatedAt: { type: string, format: date-time }
        replacementOf:
          type: [string, 'null']
          format: uuid
          description: The original task ID when this task is a replacement control.
        replacedBy:
          type: [string, 'null']
          format: uuid
          description: The replacement task ID when this task's accepted audit was replaced.
    EmployeeTaskListResponse:
      type: object
      additionalProperties: false
      required: [tasks]
      properties:
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/EmployeeTaskListItem'
    EmployeeTaskListItem:
      type: object
      additionalProperties: false
      required: [id, type, establishment, service, state, createdAt]
      properties:
        id: { type: string, format: uuid }
        type:
          type: string
          enum: [graphie_mobile]
        establishment: { type: string }
        service: { type: string }
        state:
          type: string
          const: draft
        createdAt: { type: string, format: date-time }
    EmployeeTaskResponse:
      type: object
      additionalProperties: false
      required: [task]
      properties:
        task:
          $ref: '#/components/schemas/EmployeeTaskListItem'
    GraphieDraftPayload:
      type: object
      description: >-
        Graphie Mobile form payload, catalogue graphie-mobile-pov 2.0.0, schema 3, rule cetem-paper-form 2.0.0.
        Values are raw strings, kept unchanged; blank and unparseable readings are valid. legacyContent is refused
        on a submission.
      additionalProperties: false
      required: [catalogueId, catalogueVersion, schemaVersion, ruleId, ruleVersion, values]
      properties:
        catalogueId: { type: string, const: graphie-mobile-pov }
        catalogueVersion: { type: string, const: 2.0.0 }
        schemaVersion: { type: integer, const: 3 }
        ruleId: { type: string, const: cetem-paper-form }
        ruleVersion: { type: string, const: 2.0.0 }
        values:
          type: object
          additionalProperties: { type: string }
        legacyContent: { type: string }
    SyncOperationRequest:
      type: object
      additionalProperties: false
      required: [operationId, idempotencyKey, baseRevision, localDraftRevision, clientSavedAt, payload]
      properties:
        operationId: { type: string, format: uuid }
        idempotencyKey: { type: string, format: uuid }
        baseRevision: { type: integer, minimum: 0 }
        localDraftRevision: { type: integer, minimum: 1 }
        clientSavedAt: { type: string, format: date-time }
        payload:
          type: object
          description: >-
            A GraphieDraftPayload. Its content is validated by the server and refused with a stored 422
            SyncOperationRejected (UNSUPPORTED_PAYLOAD, UNSUPPORTED_PAYLOAD_VERSION, INVALID_PAYLOAD), not by the envelope.
          additionalProperties: true
        conflictOperationId:
          type: string
          format: uuid
          description: >-
            Optional. The operation ID of the stored conflict outcome this operation resolves (keep-local).
            It must be a conflict of the same actor and task, not yet linked; otherwise the operation is
            refused with a stored 422 INVALID_CONFLICT_REFERENCE. On acceptance one sync-conflict-revision
            lineage link is recorded.
        correctionOfOperationId:
          type: string
          format: uuid
          description: >-
            Optional. The operation ID of the stored rejected submission this operation corrects. It must be
            a rejected submit of the same actor and task, with a code other than AUDIT_ALREADY_SUBMITTED, not
            yet linked or already linked as a correction to this task's audit; otherwise the operation is
            refused with a stored 422 INVALID_CORRECTION_REFERENCE. The first accepted operation carrying an
            unlinked reference records one rejected-submission-correction lineage link.
    SyncOperationKind:
      type: string
      enum: [sync-draft, submit]
    SyncActor:
      type: object
      additionalProperties: false
      required: [id, displayName]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
    SyncOperationAccepted:
      type: object
      additionalProperties: false
      required: [outcome, operationId, kind, serverRevision, acceptedAt, acceptedBy]
      properties:
        outcome: { type: string, const: accepted }
        operationId: { type: string, format: uuid }
        kind:
          $ref: '#/components/schemas/SyncOperationKind'
        serverRevision: { type: integer, minimum: 1 }
        acceptedAt: { type: string, format: date-time }
        acceptedBy:
          $ref: '#/components/schemas/SyncActor'
        submissionId:
          type: string
          format: uuid
          description: Present only for a submission.
    SyncOperationConflict:
      type: object
      additionalProperties: false
      required: [outcome, operationId, kind, serverRevision, current]
      properties:
        outcome: { type: string, const: conflict }
        operationId: { type: string, format: uuid }
        kind:
          $ref: '#/components/schemas/SyncOperationKind'
        serverRevision: { type: integer, minimum: 0 }
        current:
          type: object
          additionalProperties: false
          required: [revision, state, lastChangedAt, lastChangedBy]
          properties:
            revision: { type: integer, minimum: 0 }
            state:
              type: string
              enum: [draft, submitted]
            lastChangedAt:
              type: [string, 'null']
              format: date-time
            lastChangedBy:
              oneOf:
                - $ref: '#/components/schemas/SyncActor'
                - type: 'null'
    SyncOperationRejected:
      type: object
      additionalProperties: false
      required: [outcome, operationId, kind, code, message, issues]
      properties:
        outcome: { type: string, const: rejected }
        operationId: { type: string, format: uuid }
        kind:
          $ref: '#/components/schemas/SyncOperationKind'
        code:
          type: string
          enum: [UNSUPPORTED_PAYLOAD, UNSUPPORTED_PAYLOAD_VERSION, INVALID_PAYLOAD, AUDIT_ALREADY_SUBMITTED, INVALID_CONFLICT_REFERENCE, INVALID_CORRECTION_REFERENCE]
        message: { type: string }
        issues:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [path, code]
            properties:
              path: { type: string }
              code: { type: string }
    EmployeeTaskAuditVersion:
      type: object
      additionalProperties: false
      required: [revision, state, lastChangedAt, lastChangedBy, payload]
      properties:
        revision: { type: integer, minimum: 0 }
        state:
          type: string
          enum: [draft, submitted]
        lastChangedAt:
          type: [string, 'null']
          format: date-time
        lastChangedBy:
          oneOf:
            - $ref: '#/components/schemas/SyncActor'
            - type: 'null'
        payload:
          oneOf:
            - $ref: '#/components/schemas/GraphieDraftPayload'
            - type: 'null'
    EmployeeTaskRecoverySeedResponse:
      type: object
      additionalProperties: false
      required: [recovery]
      properties:
        recovery:
          oneOf:
            - $ref: '#/components/schemas/EmployeeTaskRecoverySeed'
            - type: 'null'
    EmployeeTaskRecoverySeed:
      type: object
      additionalProperties: false
      required: [recoveryId, source, seed, provenance]
      properties:
        recoveryId: { type: string, format: uuid }
        source:
          type: object
          additionalProperties: false
          required: [taskId, auditId, revision, employee]
          properties:
            taskId: { type: string, format: uuid }
            auditId: { type: string, format: uuid }
            revision: { type: integer, minimum: 1 }
            employee: { $ref: '#/components/schemas/SyncActor' }
        seed:
          type: object
          additionalProperties: false
          required: [revision, payload]
          properties:
            revision: { type: integer, minimum: 1 }
            payload: { $ref: '#/components/schemas/GraphieDraftPayload' }
        provenance:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [destinationField, sourceField, sourceTaskId, sourceAuditId, sourceRevision, origin]
            properties:
              destinationField: { type: string }
              sourceField: { type: string }
              sourceTaskId: { type: string, format: uuid }
              sourceAuditId: { type: string, format: uuid }
              sourceRevision: { type: integer, minimum: 1 }
              origin: { type: string, enum: [copied-from-recovery-source] }
    HealthResponse:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          const: ok
        version:
          type: string
          const: v1
    ApiError:
      type: object
      description: >-
        Error envelope. Codes include VALIDATION_ERROR, AUTHENTICATION_FAILED, FORBIDDEN, TASK_NOT_FOUND,
        PAYLOAD_TOO_LARGE, IDEMPOTENCY_KEY_REUSED, AUDIT_NOT_ACCEPTED, REPLACEMENT_ALREADY_EXISTS,
        TASK_ASSIGNEE_UNAVAILABLE and INTERNAL_ERROR.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: object
                required: [path, message]
                properties:
                  path:
                    type: string
                  message:
                    type: string
