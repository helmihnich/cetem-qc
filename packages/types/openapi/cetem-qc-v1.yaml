        '403': { description: Responsable role required (FORBIDDEN), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '404': { description: Malformed, unknown or another team's task or file (TASK_NOT_FOUND), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '409': { description: Summary not confirmed (SUMMARY_NOT_CONFIRMED), no current conformity decision (CONFORMITY_NOT_DECIDED), file not ready (REPORT_FILE_NOT_READY), file already a candidate for the current data (REPORT_FILE_ALREADY_ATTACHED) attempt used elsewhere (REPORT_ATTEMPT_CONFLICT) or an official report already designated (REPORT_OFFICIAL_DESIGNATED), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '422': { description: Missing or invalid attemptId, or extra property (VALIDATION_FAILED), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '500': { description: Evidence inconsistent or candidate not recorded (INTERNAL_ERROR), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /tasks/{taskId}/report-candidates/{candidateId}/designate:
    post:
      operationId: designateReportCandidate
      summary: Designate one ready report candidate as the official report of the control
      description: >-
        Responsable only, owning team only. The body is an empty object. Designates one ready, current candidate (Word
        or PDF) as the single official report of the task; the choice is final and nothing can replace it. The server
        rechecks in one transaction that the candidate is ready and still bound to the current confirmed summary,
