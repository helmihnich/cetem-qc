        in the history. After reopening there is no current confirmed summary until the Responsable confirms again, and a
        new version number is expected. The body carries nothing. Refused when the summary is not confirmed, and when a
        registered module reports an official designation. A malformed, unknown or another team's task, and an own-team
        task without accepted submission, all get the same 404.
