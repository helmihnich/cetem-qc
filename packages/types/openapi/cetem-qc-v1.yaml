        A replacement or recovery relation of a completed control. The related ids are present only when the viewer is
        authorized for the related task; otherwise `accessible` is false and every other field is null.
      additionalProperties: false
      required: [relation, accessible, taskId, auditId, completed]
      properties:
        relation:
          type: string
          enum: [replacement-of, replaced-by, recovery-source, recovery-successor]
        accessible: { type: boolean }
        taskId: { type: [string, 'null'], format: uuid }
        auditId: { type: [string, 'null'], format: uuid }
        completed: { type: [boolean, 'null'] }
    HistoryListItem:
      type: object
      additionalProperties: false
      required: [taskId, type, establishment, service, assignee, auditId, auditRevision, acceptedAt, designatedAt, conformityOutcome, reportOrigin, lineage]
      properties:
        taskId: { type: string, format: uuid }
        type: { type: string, enum: [graphie_mobile] }
        establishment: { type: string }
        service: { type: string }
        assignee: { type: string }
        auditId: { type: string, format: uuid }
        auditRevision: { type: integer, minimum: 1 }
        acceptedAt: { type: string, format: date-time }
        designatedAt: { type: string, format: date-time }
        conformityOutcome:
          $ref: '#/components/schemas/ConformityOutcome'
        reportOrigin:
          type: string
          enum: [generated-word, uploaded-pdf]
