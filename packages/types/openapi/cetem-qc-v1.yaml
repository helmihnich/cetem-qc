            $ref: '#/components/schemas/HistoryLineageRelation'
    HistoryListResponse:
      type: object
      additionalProperties: false
      required: [records]
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/HistoryListItem'
    HistoryRecordResponse:
      type: object
      description: >-
        A completed control exactly as stored: the accepted evidence of the 9.1 review plus the official report and the
        lineage relations visible to the viewer. A completed control always has a confirmed summary and a conformity decision.
      additionalProperties: false
      required: [task, submission, identity, values, results, insights, insightDecisions, manualInsights, summary, summaryVersion, summaryHistory, conformityDecision, conformityHistory, officialReport, lineage]
      properties:
        task:
          type: object
          additionalProperties: false
          required: [id, establishment, service, assignee]
          properties:
            id: { type: string, format: uuid }
            establishment: { type: string }
            service: { type: string }
            assignee: { type: string }
        submission:
          type: object
          additionalProperties: false
          required: [submissionId, auditId, revision, submittedBy, acceptedAt]
          properties:
            submissionId: { type: string, format: uuid }
            auditId: { type: string, format: uuid }
            revision: { type: integer, minimum: 1 }
            submittedBy:
              type: object
              additionalProperties: false
              required: [id, displayName]
              properties:
                id: { type: string, format: uuid }
                displayName: { type: string }
            acceptedAt: { type: string, format: date-time }
        identity:
          type: object
          additionalProperties: false
          required: [catalogueId, catalogueVersion, schemaVersion, ruleId, ruleVersion]
          properties:
            catalogueId: { type: string }
            catalogueVersion: { type: string }
            schemaVersion: { type: integer }
            ruleId: { type: string }
            ruleVersion: { type: string }
        values:
          type: object
          description: The stored payload values, strings unchanged.
          additionalProperties: { type: string }
        results:
          type: object
          description: The server calculation snapshot as stored, one entry per paper test. The shape is owned by packages/domain.
          required: [voltageAccuracy, voltageRepeatability, outputRepeatability, outputLinearity, lightFieldCorrespondence]
          additionalProperties: false
          properties:
            voltageAccuracy: { type: object, additionalProperties: true }
            voltageRepeatability: { type: object, additionalProperties: true }
            outputRepeatability: { type: object, additionalProperties: true }
            outputLinearity: { type: object, additionalProperties: true }
            lightFieldCorrespondence: { type: object, additionalProperties: true }
        insights:
          $ref: '#/components/schemas/InsightProposalSet'
        insightDecisions:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceInsightDecision'
        manualInsights:
          type: array
          items:
            $ref: '#/components/schemas/ManualInsight'
        summary:
          $ref: '#/components/schemas/ConfirmedSummary'
        summaryVersion:
          type: object
          additionalProperties: false
          required: [number, state]
          properties:
            number: { type: integer, minimum: 1 }
            state: { type: string, enum: [confirmed, open] }
        summaryHistory:
          type: array
          items:
            $ref: '#/components/schemas/SummaryHistoryItem'
        conformityDecision:
          $ref: '#/components/schemas/ConformityDecision'
        conformityHistory:
          type: array
          items:
            $ref: '#/components/schemas/ConformityHistoryItem'
        officialReport:
          $ref: '#/components/schemas/OfficialReport'
        lineage:
          type: array
          items:
            $ref: '#/components/schemas/HistoryLineageRelation'
    ReportCandidate:
      type: object
      description: >-
        A report candidate, generated Word (template set, source null) or uploaded PDF (template null, source set). It is never official in this story, and no official designation property exists.
      additionalProperties: false
      required: [id, attemptId, origin, status, requestedAt, requestedBy, bindings, template, source, file, failureClass]
      properties:
        id: { type: string, format: uuid }
        attemptId: { type: string, format: uuid }
        origin:
          type: string
          enum: [generated-word, uploaded-pdf]
        status:
          $ref: '#/components/schemas/ReportCandidateStatus'
        requestedAt: { type: string, format: date-time }
        requestedBy:
          type: object
          additionalProperties: false
          required: [id, displayName]
          properties:
            id: { type: string }
            displayName: { type: string }
        bindings:
          type: object
          additionalProperties: false
          required: [auditRevision, summaryId, summaryVersion, conformityDecisionId, conformityOutcome]
          properties:
            auditRevision: { type: integer, minimum: 1 }
            summaryId: { type: string, format: uuid }
            summaryVersion: { type: integer, minimum: 1 }
            conformityDecisionId: { type: string, format: uuid }
            conformityOutcome:
              $ref: '#/components/schemas/ConformityOutcome'
        template:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [id, version]
              properties:
                id: { type: string }
                version: { type: string }
        source:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [fileId, scanResult]
              properties:
                fileId: { type: string, format: uuid }
                scanResult:
                  type: string
                  enum: [clean, not-performed]
        file:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [name, byteSize, sha256]
              properties:
                name: { type: string }
                byteSize: { type: integer, minimum: 0 }
                sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        failureClass:
          oneOf:
            - type: 'null'
            - type: string
              enum: [generation-failed, storage-failed]
    ReportCandidateList:
      type: object
      additionalProperties: false
      required: [candidates]
      properties:
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/ReportCandidate'
    StoredFileStatus:
      type: string
      enum: [rejected, quarantined, scan-pending, scan-failed, storage-failed, ready]
    StoredFile:
      type: object
      description: >-
        A manually prepared PDF with its derived validation and scan status. It is never official in this story: no
        storage key, official designation or report property exists.
      additionalProperties: false
      required: [id, attemptId, status, fileName, byteSize, sha256, uploadedAt, uploadedBy, validation, scan]
      properties:
        id: { type: string, format: uuid }
        attemptId: { type: string, format: uuid }
        status:
          $ref: '#/components/schemas/StoredFileStatus'
        fileName: { type: string }
        byteSize: { type: integer, minimum: 0 }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        uploadedAt: { type: string, format: date-time }
        uploadedBy:
          type: object
          additionalProperties: false
          required: [id, displayName]
          properties:
            id: { type: string }
            displayName: { type: string }
        validation:
          type: object
          additionalProperties: false
          required: [result, class]
          properties:
            result:
              type: string
              enum: [passed, rejected, quarantined]
            class:
              oneOf:
                - type: 'null'
                - type: string
        scan:
          type: object
          additionalProperties: false
          required: [result, scanner, checkedAt]
          properties:
            result:
              type: string
              enum: [clean, threat, unavailable, not-performed, pending]
            scanner:
              oneOf:
                - type: 'null'
                - type: string
                  enum: [none, clamav]
            checkedAt:
              oneOf:
                - type: 'null'
                - type: string
                  format: date-time
    StoredFileList:
      type: object
