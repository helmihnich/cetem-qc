        '404': { description: Malformed, unknown or another team's task, or no accepted submission (TASK_NOT_FOUND), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '409': { description: The summary is not confirmed (SUMMARY_NOT_CONFIRMED) or an official report is designated (SUMMARY_DESIGNATED), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '422': { description: Non-empty body (VALIDATION_FAILED), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '500': { description: Evidence inconsistent or reopening not recorded (INTERNAL_ERROR), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /tasks/{taskId}/conformity-decision:
    post:
      operationId: recordConformityDecision
      summary: Record the explicit machine conformity decision for the current confirmed summary
      description: >-
        Responsable only. The body carries the outcome only; actor and date come from the session and the server clock.
        There is no default outcome and no value is computed or suggested. Refused when the summary is not confirmed
        (SUMMARY_NOT_CONFIRMED) and when a decision already exists for the current confirmed summary
        (CONFORMITY_ALREADY_DECIDED); a decision changes only by reopening the summary, which makes it historical.
