        '403': { description: Responsable role required (FORBIDDEN), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '404': { description: Malformed, unknown or another team's task or candidate (TASK_NOT_FOUND), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '409': { description: Candidate not ready (REPORT_CANDIDATE_NOT_READY), candidate outdated (REPORT_CANDIDATE_OUTDATED) or another candidate already official (REPORT_ALREADY_OFFICIAL), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '422': { description: Body is not an empty object (VALIDATION_FAILED), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '500': { description: Evidence inconsistent or designation not recorded (INTERNAL_ERROR), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /tasks/{taskId}/official-report:
    get:
      operationId: getOfficialReport
