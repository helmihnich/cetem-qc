        '200':
          description: Replay of a designation of the same candidate (Cache-Control no-store)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfficialReport'
        '201':
          description: Designated official report (Cache-Control no-store)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfficialReport'
